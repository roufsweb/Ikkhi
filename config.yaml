# Ikkhi System Configuration

system:
  name: "Ikkhi"
  debug: true
  storage_directory: "storage"

network:
  # Optional proxy configuration for model downloads (leave empty for direct connection)
  proxy: ""
  use_proxy_for_downloads: false

audio:
  # Mode options: "both", "push_to_talk", "wake_word"
  activation_mode: "both"
  push_to_talk_key: "ctrl+alt+space"
  wake_word: "hey ikkhi"
  sample_rate: 16000
  # STT: faster-whisper model ("tiny.en", "base.en", "small.en")
  whisper_model: "base.en"
  whisper_device: "cuda" # "cuda" (for NVIDIA RTX) or "cpu"
  compute_type: "float16" # or "int8" for CPU
  # Natural Voice Synthesis (Google Assistant / Neural Assistant style)
  tts_engine: "neural" # "neural" (natural edge-tts) or "sapi" (legacy offline)
  tts_voice: "en-US-AvaNeural" # Ava or Aria sounds like Google Assistant
  input_device: null # null for smart auto-detection, or specific integer index
  output_device: null # null for smart auto-detection, or specific integer index

ai_tier:
  # Google AI Studio settings (strictly on-demand)
  enable_cloud_fallback: true
  model_name: "gemini-2.5-flash"
  auto_select_model: true # Query API first to verify model availability before commanding
  max_output_tokens: 350
  temperature: 0.1

screen_indexing:
  # Credit & Token optimization
  crop_active_window_only: true
  max_image_dimension: 1024 # Resizes before sending to Gemini to minimize tokens
  jpeg_quality: 80
  cache_ttl_seconds: 5

pointer:
  # Visual cursor pointing behavior
  smooth_move_duration: 0.35
  highlight_circle_radius: 25
  highlight_duration_seconds: 1.5

universal_automation:
  # Dynamic per-app UI inspection and adaptive learning
  enabled: true
  profiles_directory: "storage/profiles"
  uia_search_depth: 4
  auto_learn_interactions: true
  max_cached_controls_per_app: 250
